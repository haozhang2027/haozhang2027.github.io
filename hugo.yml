baseURL: "https://haozhang2027.github.io/"
defaultContentLanguage: en
title: "Hao's Blogs"
theme: "PaperMod"
paginate: 10
enableRobotsTXT: true

languages:
  en:
    locale: en-US
    label: English
    weight: 1

outputs:
  home:
    - HTML
    - RSS
    - JSON

menus:
  main:
    - name: 具身后训练
      url: /categories/embodied-post-training/
      weight: 10
    - name: Agentic robotics
      url: /categories/agentic-robotics/
      weight: 20
    - name: others
      url: /categories/others/
      weight: 30
    - name: 全部文章
      pageRef: /posts
      weight: 40
    - name: 搜索
      pageRef: /search
      weight: 50

taxonomies:
  tag: tags
  category: categories

minify:
  disableJS: true
  disableCSS: false
  disableHTML: false
  disableJSON: false
  disableSVG: false
  disableXML: false

params:
  env: production
  title: "Hao's Blogs"
  description: "具身后训练、Agentic robotics 与其他研究和学习笔记。"
  author: Hao Zhang
  mainSections:
    - posts
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  ShowToc: true
  homeInfoParams:
    Title: "Hao's Blogs"
    Content: "具身后训练、Agentic robotics 与其他研究和学习笔记。"
  socialIcons:
    - name: github
      url: "https://github.com/haozhang2027"
    - name: email
      url: "mailto:haozhang2027@gmail.com"
    - name: rss
      url: "/index.xml"

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      wikilinks: true
      passthrough:
        enable: true
        delimiters:
          block:
            - ["$$", "$$"]
          inline:
            - ["$", "$"]
  highlight:
    noClasses: false
